# The harness's own PostgreSQL, when the project has no dev database mode (DEV_DB empty).
# Added to docker-compose.yml by hlib.compose_files.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
