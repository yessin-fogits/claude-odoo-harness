; Test runtime configuration of the harness. Not for production.
; Rendered from the harness settings into .harness/odoo.conf before each compose call.
[options]
; The repository is mounted read-only on /mnt/repo, Odoo Enterprise on /mnt/enterprise.
addons_path = {{ADDONS_PATH}}
data_dir = /var/lib/odoo
; The harness's own PostgreSQL, or the dev stack's in dev DB mode. The password comes from
; the environment (PASSWORD, PGPASSWORD), so a dev password is never written to a file.
db_host = {{DB_HOST}}
db_port = {{DB_PORT}}
db_user = {{DB_USER}}
; Listen on all interfaces inside the container (Odoo 20.0 defaults to 127.0.0.1),
; so the e2e container can reach it; the host port is published on 127.0.0.1 only.
http_interface = 0.0.0.0
; The harness works on the disposable test DB, installed with demo data, and in dev DB mode
; on the dev DB too (e2e only).
dbfilter = {{DBFILTER}}
list_db = False
{{DEMO_OPTION}}
admin_passwd = harness-dev-only
log_level = info
