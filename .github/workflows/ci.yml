name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest shellcheck-py actionlint-py "pylint-odoo==10.0.12"
      - run: actionlint .github/workflows/ci.yml
      - run: python -m pytest -q

  skill-check:
    # The odoo skill of this branch must match the real Odoo source of its version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Odoo source of this branch's version
        run: |
          version=$(python -c "import json; print(json.load(open('odoo_version.json'))['odoo_version'])")
          tools/odoo-skill-extract/fetch_odoo.sh "$version" "$RUNNER_TEMP/odoo"
          python tools/odoo-skill-extract/extract.py "$RUNNER_TEMP/odoo" -o "$RUNNER_TEMP/facts.json"
      - name: Check the skill against the facts
        run: |
          if [ -f skills/odoo/SKILL.md ]; then
            python tools/odoo-skill-extract/check_skill.py "$RUNNER_TEMP/facts.json" skills/odoo
          else
            echo "no odoo skill on this branch"
          fi

  branches:
    # Shared harness files are identical on all version branches.
    # Only a push to a version branch fails until every branch has the change.
    # Pull requests and work branches are not merged nor forward-ported yet,
    # so there the check only warns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run tools/check_branches.sh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          case "$EVENT:$REF" in
            push:17.0|push:18.0|push:19.0|push:20.0) tools/check_branches.sh ;;
            *) tools/check_branches.sh --warn ;;
          esac

  odoo-e2e:
    # The harness on a demo project against real Odoo + PostgreSQL + Playwright (Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the demo project
        working-directory: ${{ github.workspace }}
        run: python tools/make_demo_project.py demo
      - name: "Initialization step 1: harness/init.sh (baseline verification)"
        run: harness/init.sh
      - name: Feature F-001 (task T0001) reaches passing on its task branch
        run: |
          git config user.name ci && git config user.email ci@example.com
          python3 harness/feature.py start F-001
          test "$(git symbolic-ref --short HEAD)" = T0001
          # the feature's change: L1 lints the changed module with the project's rcfile
          echo "# F-001" >> extra-addons/demo/demo_mod/models/thing.py
          python3 harness/feature.py verify F-001
          python3 harness/feature.py check
          python3 -c "import json, sys; f = json.load(open('feature_list.json'))['features'][0]; sys.exit(f['state'] != 'passing')"
          git add -A && git commit -q -m "[T0001] F-001 A user creates a demo thing and finds it in the list"
      - name: Project map and debt report (discovery tools)
        run: |
          python3 harness/project_map.py
          python3 harness/static_checks.py --all || true
      - name: An injected bug fails verification with a red-pen message
        run: |
          python3 harness/feature.py start F-001 --reopen
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extra-addons/demo/demo_mod/models/thing.py")
          s = p.read_text().replace("from odoo import fields, models", "from odoo import api, fields, models")
          s += (
              "\n    @api.model_create_multi\n"
              "    def create(self, vals_list):\n"
              "        for vals in vals_list:\n"
              "            vals['name'] = (vals.get('name') or '').upper()\n"
              "        return super().create(vals_list)\n"
          )
          p.write_text(s)
          PY
          log="$RUNNER_TEMP/verify.log"
          if python3 harness/feature.py verify F-001 > "$log" 2>&1; then
            cat "$log"; echo "verify passed although the code is broken"; exit 1
          fi
          cat "$log"
          grep -q "WHY:" "$log" && grep -q "HOW TO FIX:" "$log" && grep -q "test_create" "$log"
          grep -q "AssertionError" "$log"
          if grep -q "No catalog entry" "$log"; then echo "a failure has no red-pen explanation"; exit 1; fi
          python3 -c "import json, sys; f = json.load(open('feature_list.json'))['features'][0]; sys.exit(f['state'] != 'in_progress')"
      - name: Odoo server log
        if: failure()
        run: docker compose --project-directory . -f harness/docker-compose.yml --env-file harness/harness.env logs --no-color --tail 300 odoo
      - name: Upload the harness runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/demo/.harness/
          if-no-files-found: ignore
          include-hidden-files: true
