; Test runtime configuration of the harness (harness/docker-compose.yml). Not for production.
; Rewritten by the update skill from harness/harness.env.
[options]
; The repository is mounted read-only on /mnt/repo, Odoo Enterprise on /mnt/enterprise.
addons_path = {{ADDONS_PATH}}
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Listen on all interfaces inside the container (Odoo 20.0 defaults to 127.0.0.1),
; so the e2e container can reach it; the host port is published on 127.0.0.1 only.
http_interface = 0.0.0.0
; The harness only works on the disposable test DB, installed with demo data.
dbfilter = ^{{TEST_DB}}$
list_db = False
{{DEMO_OPTION}}
admin_passwd = harness-dev-only
log_level = info
