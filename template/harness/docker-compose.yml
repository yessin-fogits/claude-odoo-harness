# Odoo harness test runtime: its own compose project, Postgres and port, so it never touches
# the project's dev or deployment stacks. Use it through harness/init.sh and harness/verify.sh
# (docker compose --project-directory <repo> -f harness/docker-compose.yml
#  --env-file harness/harness.env). Paths are relative to the repository root.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    # Built from the project's Dockerfile by harness/init.sh when ODOO_DOCKERFILE is set.
    image: ${ODOO_IMAGE:-odoo:17.0}
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      ODOO_RC: /etc/odoo/odoo.conf
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    volumes:
      - ./:/mnt/repo:ro
      - ${ENTERPRISE_DIR:-./harness}:/mnt/enterprise:ro
      - ./harness/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Tools, run on demand by harness/verify.sh (docker compose run --rm <service> ...).
  lint:
    build:
      context: harness/docker
      dockerfile: lint.Dockerfile
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - .:/work

  e2e:
    build:
      context: harness/docker
      dockerfile: e2e.Dockerfile
    profiles: ["tools"]
    working_dir: /work
    ipc: host
    environment:
      ODOO_DB: ${TEST_DB:-harness_test}
      ODOO_VERSION: ${ODOO_VERSION:-17.0}
    volumes:
      - .:/work

volumes:
  db-data:
  odoo-data:
