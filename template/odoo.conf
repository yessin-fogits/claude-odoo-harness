; Development configuration used by the harness. Not for production.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Listen on all interfaces inside the container (Odoo 20.0 defaults to 127.0.0.1),
; so the e2e container can reach it; the host port is published on 127.0.0.1 only.
http_interface = 0.0.0.0
; The harness only works on the disposable test DB.
dbfilter = ^{{TEST_DB}}$
list_db = False
admin_passwd = harness-dev-only
log_level = info
